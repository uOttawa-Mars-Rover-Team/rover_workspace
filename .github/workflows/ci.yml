name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  ros2-ci:
    name: ROS 2 Jazzy Build & Test
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools & Linters
        run: |
          apt-get update
          apt-get install -y python3-pip python3-rosdep python3-colcon-common-extensions ros-jazzy-ament-uncrustify ros-jazzy-ament-flake8 ros-jazzy-ament-pep257
          pip install --break-system-packages black isort flake8

      - name: Install Workspace Dependencies via rosdep
        run: |
          apt-get update
          rosdep update || true
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Auto-format C++ and Python Code
        run: |
          . /opt/ros/jazzy/setup.sh
          # Auto-format C++ files for uncrustify
          ros2 run ament_uncrustify ament_uncrustify --reformat src/ || true
          # Auto-format Python files for black & isort
          black --line-length 100 src/ || true
          isort --profile black src/ || true

      - name: Python Linters (Black, isort, flake8)
        run: |
          echo "=== 1/3 Checking Black formatting ==="
          black --check --line-length 100 src/
          
          echo "=== 2/3 Checking isort imports ==="
          isort --check-only --profile black src/
          
          echo "=== 3/3 Checking Flake8 style ==="
          flake8 src/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Build Workspace
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --symlink-install --event-handlers console_direct+

      - name: Run Tests
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test --event-handlers console_direct+

      - name: Validate Test Results
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test-result --verbose