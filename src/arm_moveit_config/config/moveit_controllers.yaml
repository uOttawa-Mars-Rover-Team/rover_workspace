# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - uorover_arm_controller

  uorover_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory #specify action namespace that moveit's commands are sent to
    default: true #if multiple controllers are defined to control the same joints, this controller will be used by default
    joints:
      - q1
      - q2
      - q3
      - q4