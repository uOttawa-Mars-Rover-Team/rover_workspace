teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1 # linear joystick
    scale_linear:
      x: 1
    scale_linear_turbo:
      x: 1

    axis_angular:
      yaw: 0 # angular joystick
    scale_angular:
      yaw: 1

    enable_button: 6 # L2 shoulder button
    enable_turbo_button: 4 # L1 shoulder button

    # The following parameters are used in teleop_twist_joy.cpp from the
    # teleop_twist_joy package
    shift_up: 3
    shift_down: 0
