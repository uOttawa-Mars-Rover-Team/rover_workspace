# This is the corrected configuration for the robot.

# By default, mediamtx listens for RTSP on port 8554. We don't need to specify it.
# By default, mediamtx listens for WebRTC on port 8888. We want to change it to 8889
# to match our base station configuration.
webrtcAddress: :8889

# This section allows FFMPEG to publish streams with any name (like 'cam_front')
# without you having to pre-define them in this file.
paths:
  all: {}
