name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ros2-ci:
    name: ROS 2 Jazzy Build & Test
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation des outils de linter et dépendances système
      - name: Install Linting Tools & Rosdep
        run: |
          apt-get update
          apt-get install -y \
            python3-pip \
            python3-flake8 \
            python3-black \
            python3-isort \
            python3-colcon-common-extensions \
            python3-rosdep
          rm -rf /var/lib/apt/lists/*

      # 3. Vérification du formatage Python (Black, isort, flake8)
      - name: Python Linters (Black, isort, flake8)
        run: |
          echo "=== 1/3 Checking Black formatting ==="
          black --check --line-length 100 src/
          
          echo "=== 2/3 Checking isort imports ==="
          isort --check-only --profile black src/
          
          echo "=== 3/3 Checking Flake8 style ==="
          flake8 src/ --max-line-length=100 --extend-ignore=E203,W503

      # 4. Installation des dépendances ROS 2 du workspace
      - name: Install Workspace Dependencies via rosdep
        run: |
          rosdep update || true
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      # 5. Compilation du workspace (colcon build)
      - name: Build Workspace
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --symlink-install --event-handlers console_direct+

      # 6. Exécution des tests unitaires et linters C++ (ament_lint_auto)
      - name: Run Tests
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test --event-handlers console_direct+

      # 7. Validation des résultats des tests
      - name: Validate Test Results
        run: |
          colcon test-result --verbose