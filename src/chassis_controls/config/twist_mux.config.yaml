# Input topics handled/muxed.
# For each topic:
# - name    : name identifier to select the topic (*sub-namespace, see below)
# - topic   : input topic of geometry_msgs::Twist type
# - timeout : timeout in seconds to start discarding old messages, and use 0.0 speed instead
# - priority: priority in the range [0, 255]; the higher the more priority over other topics

twist_mux:
  ros__parameters:
    # The diff-drive controller uses geometry_msgs/Twist, not TwistStamped.
    use_stamped: false
    topics:
      controller:
        topic: cmd_vel_controller
        timeout: 1.5
        priority: 100
      joystick:
        topic: cmd_vel_joystick
        timeout: 1.5
        priority: 90
      keyboard:
        topic: cmd_vel_keyboard
        timeout: 1.5
        priority: 80
      autonomous:
        topic: cmd_vel_autonomous
        timeout: 2.0
        priority: 20
