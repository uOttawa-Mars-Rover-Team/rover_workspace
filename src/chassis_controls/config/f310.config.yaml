# Config parameters for the Logitech F310 controller
#
# The following parameters are for the node named "teleop_twist_joy"
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1 # linear joystick
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 0 # angular joystick
    scale_angular:
      yaw: 0.5

    enable_button: 4 # L2 shoulder button
    enable_turbo_button: 3 # L1 shoulder button

    inverted_reverse: false
