navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 20.0
    magnetic_declination_radians: 0.222238585602
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: true
    datum: [45.420298, -75.680707, 0.0]
