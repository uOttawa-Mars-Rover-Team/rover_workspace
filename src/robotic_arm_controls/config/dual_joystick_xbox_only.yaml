dual_joystick_arm_controller:
  ros__parameters:
    control_mode: "single"

    controller_1_type: "xbox"
    control_rate: 50.0
    deadzone: 0.15
    max_joint_velocity: 0.5
    trajectory_duration: 0.1

    controller_types.xbox.q1_axis: 0
    controller_types.xbox.q2_axis: 1
    controller_types.xbox.q3_axis: 4
    controller_types.xbox.q4_axis: 3
    controller_types.xbox.q5_axis: 2
    controller_types.xbox.q6_axis: 5

    controller_types.xbox.gripper_open_button: 0
    controller_types.xbox.gripper_close_button: 1
    controller_types.xbox.roll_cw_button: 4
    controller_types.xbox.roll_ccw_button: 5

    controller_types.xbox.q1_scale: 1.0
    controller_types.xbox.q2_scale: 1.0
    controller_types.xbox.q3_scale: 1.0
    controller_types.xbox.q4_scale: 1.0
    controller_types.xbox.q5_scale: 1.0
    controller_types.xbox.q6_scale: 1.0

    controller_types.xbox.q1_invert: false
    controller_types.xbox.q2_invert: false
    controller_types.xbox.q3_invert: false
    controller_types.xbox.q4_invert: false
    controller_types.xbox.q5_invert: false
    controller_types.xbox.q6_invert: false