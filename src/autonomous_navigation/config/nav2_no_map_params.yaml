# Modified from: https://github.com/ros-navigation/navigation2_tutorials/blob/8d80918b0e926b02758379bffbd6291fec434327/nav2_gps_waypoint_follower_demo/config/nav2_no_map_params.yaml
# Modifications:
#   - updated bt_navigator params from https://github.com/ros-navigation/navigation2/blob/humble/nav2_bringup/params/nav2_params.yaml
#
# GPS WPF CHANGES:
# - amcl params where removed. They are not needed because global localization is provided
#   by an ekf node on robot_localization fusing gps data with local odometry sources
# - static layer is removed from both costmaps, in this tutorial we assume there is no map
#   of the environment
# - global costmap is set to be rolling to allow the robot to traverse big environment by
#   following successive relatively close waypoints that fit in a smaller rolling costmap

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_cont/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# GPS WPF CHANGE: Remove static layer
#3D depth nav parameters start here
local_costmap:
  local_costmap:
    ros__parameters:
      #we set to true here to force the rover to only drive onto areas that have been mapped
      #this is in contrast with the same var being set to false for the global costmap
      #if my understanding is correct, the global costmap must be false to allow it to plan driving into unkown areas,
      #while the local needs to be true to force it to only physically go onto mapped areas
      #ie, we can plan to go into the unknown, but arent going to throw ourselves off a cliff to get there

      #NOTE: if this is causing jerky/ laggy movement, may need an alternate solution
      track_unknown_space: true 
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      
      #################################################################################
      #This may be too small!!! was set to 3 
      width: 3
      height: 3

      ############################################################################
      #The size of cells in the map, small values better represent small obstacles,
      #large values = less computation and less sensor noise. but also a ramp could appear
      # as one big step instead of a series of small ones
      resolution: 0.05

      #size of robot, may be innaccurate
      robot_radius: 0.22
      
      # The list of plugins
      # 1. Static (optional in local, usually not needed)
      # 2. Obstacle Layers (Marking)
      # 3. Inflation (Safety buffer)
      plugins: ["2d_lidar_layer", "3d_steep_obstacle_layer", "3d_ground_clearing_layer", "inflation_layer"]

      # --- LAYER 1: Existing 2D Lidar ---
      # Handles table legs, walls, standard obstacles
      2d_lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5

      # --- LAYER 2: Bad Terrain (Walls & Steep Slopes) ---
      # Input: The /obstacles topic from rtabmap
      # Action: MARK obstacles. Do NOT clear (leave clearing to the ground layer).
      3d_steep_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: steep_cloud
        steep_cloud:
          topic: /filtered/obstacles
          data_type: "PointCloud2"
          clearing: False  # Cannot unmark obstacles, that is done in layer 3
          marking: True    # Marks steep slopes/ obstacles as high cost
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1 # Ignore noise on the floor
          obstacle_max_range: 4.0

      # --- LAYER 3: Safe Terrain (Flat Ground & Ramps) ---
      # Input: The /ground topic from rtabmap
      # Action: CLEAR obstacles. Do NOT mark.
      # Logic: If we see ground here, remove any lethal costs (ghosts).
      3d_ground_clearing_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ground_cloud
        ground_cloud:
          topic: /filtered/ground
          data_type: "PointCloud2"
          clearing: True   # This removes obstacles from the map
          marking: False   # We never mark the ground as an obstacle, marking is done in layer 2
          
          # CLIFF PROTECTION CONFIGURATION
          # If the sensor sees ground, but it is > 0.5m BELOW the robot (Z < -0.5),
          # we IGNORE it. We do NOT clear the space. 
          # This leaves the cliff edge as "unknown" or occupied by previous inflation.
          min_obstacle_height: -0.5 
          max_obstacle_height: 0.5
          
          raytrace_max_range: 5.0

      # --- LAYER 4: Inflation ---
      # Keeps the robot away from the things marked in Layers 1 & 2
      #inflates the cost of points around obstacles
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  # Lower number = gentler curve (stay further away)
        inflation_radius: 0.55     # How far out the danger zone extends
      always_send_full_costmap: True

# GPS WPF CHANGE: Remove static layer
# GPS WPF CHANGE: Set rolling global costmap with 50x50 size. See note below
#added size of 50x50 to mirror nav2_no_map_params.yaml
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.1

      rolling_window: True
      # When using GPS navigation you will potentially traverse huge environments which are not practical to
      # fit on a big static costmap. Thus it is recommended to use a rolling global costmap large enough to
      # contain each pair of successive waypoints. See: https://github.com/ros-planning/navigation2/issues/2174
      width: 50
      height: 50
      #Set to false to allow planning of paths through unknown space
      #if it were true, could cause rover to refuse to path to a waypoint since the path isnt yet mapped
      track_unknown_space: false 
      
      plugins: ["obstacle_layer", "inflation_layer"]


      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan steep_cloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
        steep_cloud:
          topic: /filtered/obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

#rtabmap_util
#Obstacle Detcetion node parameters
obstacle_detection_node:
  ros__parameters:
    #frame_id: "base_link"
    #queue_size: 10

    #Controls the grouping of points into normal vectors, 
    #lower number means smaller groups, higher means larger. Value is a meausurment of distance
    #Small groups can cause over sensitivity to sensor noise/ small obstacles,
    #Large groups can cause some obstacles to be ignored
    normal_estimation_radius: 0.05

    #Maximum allowed angle between the normals of the ground, and the point cluster
    ground_normal_angle: PI/4

    #Min number of points recquired to be classified as a real obstacle
    #Low values = precise detection of small obstacles, susecptible to sensor noise
    #High values = focus on big obstacles, possible to miss smaller obstacles
    min_cluster_size: 20
    
    #Max height of obstacles the rover considers
    #Supposedly default is 0? seems strange
    max_obstacle_height: 0.0


# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "diff_cont/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
