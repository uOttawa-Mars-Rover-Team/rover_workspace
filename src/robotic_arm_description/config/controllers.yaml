controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

arm_velocity_controller:
  ros__parameters:
    joints:
      - tower_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
