name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-lint:
    name: Python Lint (Black, isort, flake8)
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          apt-get update
          apt-get install -y python3-pip
          pip install --break-system-packages black isort flake8

      - name: Black (format check)
        if: always()
        run: black --check --diff --line-length 100 src/

      - name: isort (import order check)
        if: always()
        run: isort --check-only --diff --profile black src/

      - name: flake8 (style check)
        if: always()
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203,W503 --count --statistics

  build-and-test:
    name: ROS 2 Jazzy Build & Test
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rosdep dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Build workspace
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Run tests and fail on any test failure
        run: |
          . /opt/ros/jazzy/setup.bash
          . install/setup.bash
          # colcon test is allowed to "fail" here so we always reach the report.
          # colcon test-result is the real gate: it exits non-zero if ANY test failed.
          colcon test --event-handlers console_direct+ || true
          colcon test-result --verbose