version: "3.5"
services:
  frontend:
    container_name: rover-dashboard
    image: rover-dashboard
    build: .
    ports:
      - 5173:5173
    volumes:
      - .:/rover-dashboard
      - rover-dashboard-data:/rover-dashboard/node_modules
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  default:
    name: rover-network

volumes:
  rover-dashboard-data:
    name: rover-dashboard-data
