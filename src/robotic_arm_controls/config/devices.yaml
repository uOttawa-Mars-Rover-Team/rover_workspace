# =============================================================================
# devices.yaml
# Global registry: logical axis/button names → raw Joy indices.
# dev_paths entries are glob patterns matched under /dev/input/by-id/.
# Patterns use * to absorb serial numbers and interface suffixes so that
# devices remain matchable regardless of per-unit serial differences.
# =============================================================================
categories:

  dual_joystick:
    devices:

      xbox:
        name: "Microsoft Xbox Controller"
        dev_paths:
          - "usb-Microsoft_Xbox_Controller*-event-joystick"
          - "usb-Microsoft_Controller*-event-joystick"
        buttons: 11
        axes: 8
        axis_map:
          left_x:  0
          left_y:  1
          lt:      2
          right_x: 3
          right_y: 4
          rt:      5
        button_map:
          a:          0
          b:          1
          x:          2
          y:          3
          lb:         4
          rb:         5
          select:     6
          start:      7
          dpad_up:    10
          dpad_down:  11
          dpad_left:  12
          dpad_right: 13

      logitech_f310:
        name: "Logitech F310 Gamepad"
        dev_paths:
          # Matches with or without serial number suffix (e.g. _FA73A900)
          - "usb-Logitech_Gamepad_F310*-event-joystick"
          - "usb-Logitech_Gamepad_F310*-joystick"
          - "usb-Logitech_F310*-event-joystick"
        buttons: 12
        axes: 8
        axis_map:
          left_x:  0
          left_y:  1
          lt:      2
          right_x: 3
          right_y: 4
          rt:      5
        button_map:
          a:          1
          b:          2
          x:          0
          y:          3
          lb:         4
          rb:         5
          select:     8
          start:      9
          dpad_up:    12
          dpad_down:  13
          dpad_left:  14
          dpad_right: 15

      logitech_f710:
        name: "Logitech F710 Wireless Gamepad"
        dev_paths:
          - "usb-Logitech_Wireless_Gamepad_F710*-event-joystick"
          - "usb-Logitech_Wireless_Gamepad_F710*-joystick"
        buttons: 12
        axes: 8
        axis_map:
          left_x:  0
          left_y:  1
          lt:      2
          right_x: 3
          right_y: 4
          rt:      5
        button_map:
          a:          1
          b:          2
          x:          0
          y:          3
          lb:         4
          rb:         5
          select:     8
          start:      9
          dpad_up:    12
          dpad_down:  13
          dpad_left:  14
          dpad_right: 15

  specialty:
    devices:

      spacemouse:
        name: "3Dconnexion SpaceMouse"
        dev_paths:
          # Matches Wireless, Compact, Pro, Enterprise variants
          - "usb-3Dconnexion_SpaceMouse*-event-joystick"
          - "usb-3Dconnexion_SpaceMouse*-joystick"
          - "usb-3Dconnexion*-event-joystick"
        buttons: -1
        axes: 6
        axis_map:
          x:  0
          y:  1
          z:  2
          rx: 3
          ry: 4
          rz: 5
        button_map:
          left:  0
          right: 1

      extreme3d_pro:
        name: "Logitech Extreme 3D Pro"
        dev_paths:
          - "usb-Logitech_Extreme_3D_pro*-event-joystick"
          - "usb-Logitech_Extreme_3D*-event-joystick"
          - "usb-Logitech_Logitech_Extreme_3D*-event-joystick"
        buttons: 12
        axes: 4
        axis_map:
          x:        0
          y:        1
          rz:       2
          throttle: 3
        button_map:
          trigger: 0
          thumb:   1
          b3:      2
          b4:      3
          b5:      4
          b6:      5
          b7:      6
          b8:      7
          b9:      8
          b10:     9
          b11:     10
          b12:     11